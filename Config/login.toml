# LoginServer 配置

[network]
port = 8001
io_threads = 4

[database]
conn_string = "host=127.0.0.1 port=6432 dbname=massive"
worker_count = 3

[security]
# LSS：与 WorldServer 共享，用于 SessionToken 加密/签名
# 生产环境应通过环境变量 MASSIVE_LSS 注入
login_server_secret = ""

[world]
gate_ips = ["127.0.0.1:9001"]
world_server_id = 1

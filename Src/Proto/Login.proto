// Login.proto — 登录与进入世界协议
// 顶层 Req/Rsp/Ntf 消息自动生成 MsgID（见 MsgID.proto）。
syntax = "proto3";

package MMO.Proto;

import "Common.proto";

// ── 心跳 ──

message HeartbeatReq
{
    uint64 client_time = 1;  // 客户端时间戳（ms）
}

message HeartbeatRsp
{
    uint64 server_time = 1;  // 服务器时间戳（ms）
}

// ── 登录认证（Client → LoginServer，TLS）──

message LoginAuthReq
{
    string username = 1;
    string password = 2;
    bytes  client_dh_key = 3;  // 客户端 ECDH 公钥（32B）
}

message LoginAuthRsp
{
    ErrorInfo error = 1;            // code != 0 表示失败
    repeated string gate_ips = 2;  // 可连接的 GateServer 地址列表
    bytes  session_token = 3;      // 46B SessionToken
    bytes  server_dh_key = 4;      // 服务器 ECDH 公钥（32B）
}

// ── 进入世界（Client → GateServer → WorldServer）──

message LoginEnterWorldReq
{
    bytes  session_token = 1;  // 46B SessionToken（明文，Gate 读取路由）
    uint64 nonce = 2;          // 防重放随机数
}

message LoginEnterWorldRsp
{
    ErrorInfo error = 1;
    uint32  player_id = 2;
    uint32  scene_id = 3;
    Vector3 position = 4;
}

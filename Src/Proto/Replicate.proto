// Replicate.proto — 网络复制协议
// Entity 状态同步：Spawn（入 AOI）/ Update（脏组件）/ Despawn（出 AOI）
syntax = "proto3";

package MMO.Proto;

// 整数坐标——节省带宽（float32 × 100 → varint）
message PositionDelta
{
    int32 x = 1;
    int32 y = 2;
    int32 z = 3;
}

message EntitySpawnNtf
{
    uint32 entity_id   = 1;
    uint32 entity_type = 2; // 0=Player, 1=NPC, 2=Monster
    PositionDelta position = 3;
    int32  hp_current = 4;
    int32  hp_max     = 5;
}

message EntityUpdateNtf
{
    uint32 entity_id = 1;
    // optional — 只有变更字段才序列化
    optional PositionDelta position    = 2;
    optional int32         hp_current  = 3;
    optional bool          is_dead     = 4;
    optional bool          is_in_combat = 5;
}

message EntityDespawnNtf
{
    uint32 entity_id = 1;
}

// 批量通知——每帧合并
message EntityReplicateNtf
{
    repeated EntitySpawnNtf   spawns   = 1;
    repeated EntityUpdateNtf  updates  = 2;
    repeated EntityDespawnNtf despawns = 3;
}
